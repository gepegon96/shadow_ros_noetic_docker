services:
  robot_env:
    build: 
      context: ./docker
      dockerfile: Dockerfile
    
    container_name: shadow_ros_noetic_container
    network_mode: "host"
    ipc: host
    privileged: true
    
    # 2. GPU SUPPORT (NVIDIA)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
              
    # 3. GUI ENVIRONMENT VARIABLES
    environment:
      - DISPLAY=:0
      - QT_X11_NO_MITSHM=1
      - QT_QPA_PLATFORM=xcb
      - LIBGL_ALWAYS_SOFTWARE=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      
    # 4. FOLDER MAPPING
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./workspace:/root/catkin_ws 
      - ./zed_models:/usr/local/zed/resources/
      
    command: /bin/bash
    tty: true
    stdin_open: true

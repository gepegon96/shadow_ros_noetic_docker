transform_tolerance: 1.0
publish_frequency: 10.0
update_frequency: 5.0
width: 10.0
height: 10.0
resolution: 0.1
origin_x: 0.0
origin_y: 0.0
global_frame: map
robot_base_frame: base_link
footprint: [[-0.325, -0.325], [-0.325, 0.325], [0.325, 0.325], [0.46, 0.0], [0.325, -0.325]]
footprint_padding: 0.01
rolling_window: true
plugins:
  # - {name: static, type: "costmap_2d::StaticLayer"}
  - {name: obstacles, type: "costmap_2d::ObstacleLayer"}
  - {name: inflater, type: "costmap_2d::InflationLayer"}
  # - {name: human_layer_static, type: "cohan_layers::StaticAgentLayer"}
  # - {name: human_layer_visible, type: "cohan_layers::AgentVisibilityLayer"}

obstacles:
  observation_sources: base_scan_filtered
  base_scan_filtered: {data_type: LaserScan, topic: base_scan_filtered, expected_update_rate: 0.5, marking: true, clearing: true}
  footprint_clearing_enabled: true
  track_unknown_space: true
inflater:
  inflation_radius: 0.5
# static:
#   enabled:              true
#   map_topic:            "/map"
human_layer_static:
  robot_radius: 0.46
  agent_radius: 0.31
# ==========================================================
# PAR�METROS COMUNES (F�sica del robot, Tolerancias y Est�tica)
# �CUALQUIER CAMBIO AQU� AFECTA A AMBOS PLANIFICADORES!
# ==========================================================

# Trajectory
teb_autosize: True
dt_ref: 0.125
dt_hysteresis: 0.0125
global_plan_overwrite_orientation: True
max_global_plan_lookahead_dist: 0.0 # Ojo, en TEB ten�as 1.0, lo dejo en 0.0 por HATeb
feasibility_check_no_poses: 2
global_plan_viapoint_sep: 0.2

# Robot Kinematics (Usando los valores realistas de tu HATeb)
max_vel_x: 0.7
max_vel_x_backwards: 0.1
max_vel_theta: 0.57
acc_lim_x: 0.02
acc_lim_theta: 1.0
min_turning_radius: 0.0
footprint_model: 
  type: "circular"
  radius: 0.34 

# Goal Tolerance
xy_goal_tolerance: 0.3
yaw_goal_tolerance: 0.2
free_goal_vel: True

# Obstacles (Est�ticos)
min_obstacle_dist: 0.2
include_costmap_obstacles: True
costmap_obstacles_behind_robot_dist: 0.5
obstacle_poses_affected: 1 # TEB ten�a 20, HATeb 1. Lo dejamos en 1 para eficiencia.

# Costmap Converter (De tu archivo HATeb)
costmap_converter_plugin: "costmap_converter::CostmapToLinesDBSRANSAC"
costmap_converter_spin_thread: True
costmap_converter_rate: 10
costmap_converter/CostmapToLinesDBSRANSAC:
    cluster_max_distance: 0.8
    cluster_min_pts: 2
    ransac_inlier_distance: 0.15
    ransac_min_inliers: 10
    ransac_no_iterations: 1500
    ransac_remainig_outliers: 3
    ransac_convert_outlier_pts: True
    ransac_filter_remaining_outlier_pts: False
    convex_hull_min_pt_separation: 0.1

# Optimization (Pesos compartidos)
no_inner_iterations: 12
no_outer_iterations: 7
optimization_activate: True
optimization_verbose: False
penalty_epsilon: 0.01
weight_max_vel_x: 2
weight_max_vel_y: 2
weight_max_vel_theta: 1
weight_acc_lim_x: 1
weight_acc_lim_y: 1
weight_acc_lim_theta: 3.0
weight_kinematics_nh: 10000.0
weight_kinematics_forward_drive: 800.0
weight_kinematics_turning_radius: 0
weight_optimaltime: 10.0
weight_obstacle: 20.0
weight_dynamic_obstacle: 50.0
weight_viapoint: 10.0
weight_shortest_path: 59.0


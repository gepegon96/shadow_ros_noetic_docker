# Definimos el robot como un círculo de 35cm de radio (70cm diámetro total por seguridad)
robot_radius: 0.6 

obstacle_range: 6.0 # A qué distancia máxima empieza a poner obstáculos en el mapa
raytrace_range: 6.0 # A qué distancia máxima limpia el mapa si el LiDAR ve que está vacío

inflation_layer:
  inflation_radius: 0.6 # Distancia de seguridad donde el coste empieza a subir
  cost_scaling_factor: 6.0 # Suavidad de la curva de peligro (menor = evita los muros desde más lejos)

obstacle_layer:
  observation_sources: laser_scan_sensor
  laser_scan_sensor: {data_type: LaserScan, topic: /scan_bpearl, marking: true, clearing: true}